server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Service worker must be served without being cached by the browser
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Versioned assets (cache-busted via APP_VERSION in sw.js) — cache aggressively
    location ~* \.(css|js|png|ico|wav|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # manifest.json — short cache so installs pick up changes quickly
    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
